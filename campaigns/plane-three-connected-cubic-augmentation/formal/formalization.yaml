  "fidelity": {
    "divergences": "The input is a finite loopless subcubic plane multigraph represented by rational polygonal edge arcs, not a fixed straight-line drawing. This is a concrete representative of the topological embedding; bends are allowed, disconnected components and their actual nesting are retained, and new arcs may have arbitrarily many rational bends. Augmentations retain the old drawing exactly and may add edges between old vertices as well as new vertices. The source forbids new vertices; the target allows them. Both return Boolean decisions. Parallel edges are permitted as in the paper, but no loops or overlapping arcs. Three-connectivity requires at least four vertices. Rational polygonal representatives impose no geometric straight-line restriction on topological plane embeddings. Theorem 6.2 supplies a linear-size certificate construction for the augmentation problem; no bounded oracle is needed to state existence."
  },
